
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <a href="index.html">Home |</a>

    <a href="destination.html">Destinations |</a>
    <a href="gallery.html">Gallery |</a>

</nav>

<main class="container py-5">
  <h1>Contact and Booking Enquiries</h1>
  <p>Complete the form to enquire about your visit to Lesotho.</p>

  <form id="bookingForm" class="booking-form">
    <label for="name" class="form-label">Full name:</label>
    <input type="text" id="name" class="form-control mb-3" required>

    <label for="email" class="form-label">Email address:</label>
    <input type="email" id="email" class="form-control mb-3" required>

    <label for="date" class="form-label">Preferred visit date:</label>
    <input type="date" id="date" class="form-control mb-3" required>

    <label for="destination" class="form-label">Destination:</label>
    <select id="destination" class="form-select mb-3" required>
      <option value="">Choose a destination</option>
      <option>Maletsunyane Falls</option>
      <option>Katse Dam</option>
      <option>Lesotho Highlands</option>
      <option>Mohale Dam</option>
      <option>Ts'ehlanyane National Park</option>
      <option>Thaba-Bosiu Cultural village</option>
      <option>Qiloane</option>
      <
    </select>

    <label for="message" class="form-label">Message</label>
    <textarea id="message" class="form-control mb-3" rows="3"></textarea>

    <button type="submit" class="btn btn-success">Send Enquiry</button>
  </form>

  <p id="formMessage" class="mt-3" aria-live="polite"></p>
</main>

<footer>© 2026 Discover Lesotho Tourism</footer>
<script src="script.js"></script>
</body>
</html>
